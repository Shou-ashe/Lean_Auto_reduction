schema_version: opencode_lean_proposition_sample_file_v1
id: nested_nae3_csp_local_adapter
name: nested_nae3_csp_local_adapter_problem
benchmark_level: L8
input_language: nested_nae3_csp_local_adapter_interface
problem_family: boolean_csp_interface
certificate_contract: lean_proposition
problem_statement: "Input is packaged as ((ignored audit bit, fixed not-all-equal ternary Boolean CSP instance), ignored checksum bit). Decide whether the CSP instance is satisfiable. Certify NP membership by writing a local adapter proof from this nested interface to the standard not-all-equal CSP problem, then use local library evidence for the target."
difficulty: local_adapter_authoring
difficulty_tags: [csp, local_helper, nonidentity_map, nested_projection]
lean_target_name: targetClaim
lean_preamble: |
  import ComplexityReduction

  noncomputable section

  abbrev localAdapterTarget : ComplexityReduction.EncodedDecisionProblem :=
    ComplexityReduction.CSP.Examples.notAllEqual3DecisionProblem

  abbrev problem : ComplexityReduction.EncodedDecisionProblem :=
    { Instance := ComplexityReduction.EncodedType.prod
        (ComplexityReduction.EncodedType.prod
          ComplexityReduction.EncodedType.bool
          localAdapterTarget.Instance)
        ComplexityReduction.EncodedType.bool
      isYes := fun p => localAdapterTarget.isYes p.1.2 }
lean_target_type: |
  (∀ x : problem.Instance.Carrier,
      problem.isYes x ↔ localAdapterTarget.isYes x.1.2) ∧
    ∃ _localAdapterReduction :
      ComplexityReduction.KarpReductionM
        ComplexityReduction.CostedPolyTimeModel
        problem
        localAdapterTarget,
      ComplexityReduction.PolyReducibleM
        ComplexityReduction.CostedPolyTimeModel
        problem
        localAdapterTarget ∧
      ComplexityReduction.InNPEnc
        ComplexityReduction.CostedPolyTimeModel
        localAdapterTarget ∧
      ComplexityReduction.InNPEnc
        ComplexityReduction.CostedPolyTimeModel
        problem
