schema_version: opencode_decision_problem_sample_file_v1
id: hard_nested_set_cover_exact_cover_textbook_adapter
name: hard_nested_set_cover_exact_cover_textbook_adapter_problem
input_language: nested_set_cover_textbook_exact_cover_adapter
problem_family: set_system_interface
problem_statement: Input is packaged as (ignored audit bit, (standard Set Covering instance, ignored checksum bit)). Decide whether the Set Covering instance is accepting.
certificate_contract: lean_proposition
lean_target_name: targetClaim
lean_preamble: |
  import ComplexityReduction

  noncomputable section

  abbrev sourceProblem : ComplexityReduction.EncodedDecisionProblem :=
    ComplexityReduction.Combinatorics.setCoveringDecisionProblem

  abbrev problem : ComplexityReduction.EncodedDecisionProblem :=
    { Instance := ComplexityReduction.EncodedType.prod
        ComplexityReduction.EncodedType.bool
        (ComplexityReduction.EncodedType.prod
          sourceProblem.Instance
          ComplexityReduction.EncodedType.bool)
      isYes := fun p => sourceProblem.isYes p.2.1 }
lean_target_type: |
  ∃ textbookTarget : ComplexityReduction.EncodedDecisionProblem,
    textbookTarget = ComplexityReduction.Combinatorics.exactCoverDecisionProblem ∧
      ∃ textbookReductionCertificate :
        ComplexityReduction.KarpReductionM ComplexityReduction.CostedPolyTimeModel problem textbookTarget,
        ∃ textbookRouteCertificate :
          ComplexityReduction.PolyReducibleM ComplexityReduction.CostedPolyTimeModel problem textbookTarget,
          ComplexityReduction.InNPEnc ComplexityReduction.CostedPolyTimeModel textbookTarget ∧
            ComplexityReduction.InNPEnc ComplexityReduction.CostedPolyTimeModel problem
difficulty: textbook_adapter_hard
difficulty_tags:
- set_system
- nonidentity_adapter
- nested_projection
- textbook_construction
