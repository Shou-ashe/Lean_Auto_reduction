problem_statement: |
  UW-Madison Theory Qual, Spring 2015, Problem 1. Given a graph G = (V, E) and
  a subset R subset of V, decide whether there exists a subset S subset of V
  such that every vertex in R has exactly one neighbor in S. Prove that this
  problem is NP-complete. (This is the efficient-domination / exact-one-in-
  neighborhood constraint; the standard hardness route is from Exact Cover by
  3-Sets or a related catalog NPC source.)
