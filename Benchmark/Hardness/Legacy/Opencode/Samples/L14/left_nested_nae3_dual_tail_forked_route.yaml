schema_version: opencode_lean_proposition_sample_file_v1
id: left_nested_nae3_dual_tail_forked_route
name: left_nested_nae3_dual_tail_forked_route_problem
benchmark_level: L14
input_language: left_nested_nae3_dual_tail_forked_route
problem_family: forked_mixed_gadget_route_composition
certificate_contract: lean_proposition
route_target_policy: any
problem_statement: "Input is a NAE-3SAT CSP instance nested in the left side of a public product interface. Prove NP membership by normalizing the interface, using the NAE-3SAT-to-3SAT gadget, and then independently extending that 3-SAT pivot through both graph and numeric public Karp21 route tails."
difficulty: forked_mixed_gadget_route_synthesis
difficulty_tags:
  - csp
  - gadget_composition
  - forked_route
  - dual_target
  - nested_projection
  - graph_target
  - numeric_target
lean_target_name: targetClaim
lean_preamble: |
  import ComplexityReduction

  noncomputable section

  abbrev sourceProblem : ComplexityReduction.EncodedDecisionProblem :=
    ComplexityReduction.CSP.Examples.notAllEqual3DecisionProblem

  abbrev graphTargetProblem : ComplexityReduction.EncodedDecisionProblem :=
    ComplexityReduction.Combinatorics.Graph.vertexCoverDecisionProblem

  abbrev numericTargetProblem : ComplexityReduction.EncodedDecisionProblem :=
    ComplexityReduction.Combinatorics.knapsackKarpDecisionProblem

  abbrev problem : ComplexityReduction.EncodedDecisionProblem :=
    { Instance := ComplexityReduction.EncodedType.prod
        (ComplexityReduction.EncodedType.prod
          sourceProblem.Instance
          ComplexityReduction.EncodedType.bool)
        ComplexityReduction.EncodedType.bool
      isYes := fun p => sourceProblem.isYes p.1.1 }
lean_target_type: |
  ∃ normalizedProblem : ComplexityReduction.EncodedDecisionProblem,
    ∃ graphRouteTarget : ComplexityReduction.EncodedDecisionProblem,
      ∃ numericRouteTarget : ComplexityReduction.EncodedDecisionProblem,
        ∃ _encodingBridgeCertificate :
          ComplexityReduction.ProblemEquivM
            ComplexityReduction.CostedPolyTimeModel
            problem
            normalizedProblem,
          ∃ _sourceToSatGadget :
            ComplexityReduction.KarpReductionM
              ComplexityReduction.CostedPolyTimeModel
              normalizedProblem
              ComplexityReduction.SAT.threeSATDecisionProblem,
            ∃ _satToGraphRoute :
              ComplexityReduction.KarpReductionM
                ComplexityReduction.CostedPolyTimeModel
                ComplexityReduction.SAT.threeSATDecisionProblem
                graphRouteTarget,
              ∃ _graphToFinalRoute :
                ComplexityReduction.KarpReductionM
                  ComplexityReduction.CostedPolyTimeModel
                  graphRouteTarget
                  graphTargetProblem,
                ∃ _satToNumericRoute :
                  ComplexityReduction.KarpReductionM
                    ComplexityReduction.CostedPolyTimeModel
                    ComplexityReduction.SAT.threeSATDecisionProblem
                    numericRouteTarget,
                  ∃ _numericToFinalRoute :
                    ComplexityReduction.KarpReductionM
                      ComplexityReduction.CostedPolyTimeModel
                      numericRouteTarget
                      numericTargetProblem,
                    ComplexityReduction.PolyReducibleM
                      ComplexityReduction.CostedPolyTimeModel
                      problem
                      graphTargetProblem ∧
                    ComplexityReduction.PolyReducibleM
                      ComplexityReduction.CostedPolyTimeModel
                      problem
                      numericTargetProblem ∧
                    ComplexityReduction.InNPEnc
                      ComplexityReduction.CostedPolyTimeModel
                      graphTargetProblem ∧
                    ComplexityReduction.InNPEnc
                      ComplexityReduction.CostedPolyTimeModel
                      numericTargetProblem ∧
                    ComplexityReduction.InNPEnc
                      ComplexityReduction.CostedPolyTimeModel
                      problem
